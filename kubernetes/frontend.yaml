apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: simplcash
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: arpitjd105/simplcash:v5
          ports:
            - containerPort: 5000
          env:
            - name: MYSQL_HOST
              value: "mysql-service"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASSWORD
              value: "root"
            - name: MYSQL_DB
              value: "simplcashdb"
            - name: SECRET_KEY
              value: "simplcash-secret"  
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: simplcash
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 31000
