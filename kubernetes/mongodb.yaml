apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: simplcash
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      name: mysql
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: arpitjd105/simplcash-db:v5
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /data/db
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: simplcash
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
